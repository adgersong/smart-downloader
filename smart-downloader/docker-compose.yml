version: '3.8'

services:
  # 前端服务
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    environment:
      - REACT_APP_API_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev

  # 后端服务
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./data:/app/data
      - ./workflows:/app/workflows
    environment:
      - DATABASE_URL=sqlite:///./data/app.db
      - OLLAMA_URL=http://ollama:11434
      - SECRET_KEY=${SECRET_KEY:-dev-secret-key-change-in-production}
    depends_on:
      - ollama

  # Ollama 服务 (Qwen VL)
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: ollama serve

  # MinIO 对象存储服务
  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    command: server /data

  # Jaeger (用于 OpenTelemetry 链路追踪)
  jaeger:
    image: jaegertracing/all-in-one:1.50
    ports:
      - "16686:16686"   # UI
      - "14268:14268"   # collector HTTP
      - "14250:14250"   # collector gRPC

  # OpenTelemetry Collector (OTLP 收集并转发至 Jaeger、Prometheus)
  otel-collector:
    image: otel/opentelemetry-collector:0.101.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
    depends_on:
      - jaeger

  # Prometheus 监控
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - otel-collector

  # Grafana 可视化
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  # Loki 日志聚合
  loki:
    image: grafana/loki:2.9.5
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ./loki-config.yaml:/etc/loki/local-config.yaml
    depends_on:
      - otel-collector

  # SQLite 数据库 (通过 volume 持久化)
  database:
    image: alpine:latest
    volumes:
      - ./data:/data

volumes:
  ollama_data:
    driver: local

  # MinIO 对象存储
  minio_data:
    driver: local

  # Prometheus 数据卷
  prometheus_data:
    driver: local

  # Grafana 配置卷
  grafana_data:
    driver: local

  # Loki 日志存储卷
  loki_data:
    driver: local

  # Jaeger 数据卷
  jaeger_data:
    driver: local
